name: Archive daily weather
on:
  schedule:
    # 09:25 Asia/Shanghai
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch historical weather
        run: python garden/update_weather.py
      - name: Merge archives for both site entry points
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('data/weather.json'), Path('garden/data/weather.json')]
          merged = {}
          for path in paths:
              for row in json.loads(path.read_text(encoding='utf-8'))['days']:
                  merged[row['date']] = row
          content = json.dumps({'days': sorted(merged.values(), key=lambda row: row['date'])}, ensure_ascii=False, indent=2) + '\n'
          for path in paths:
              path.write_text(content, encoding='utf-8')
          print(f'Archived {len(merged)} days for both entry points; latest: {max(merged, default="none")}')
          PY
      - name: Commit weather archive
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather.json garden/data/weather.json
          git diff --cached --quiet || (git commit -m 'Update weather archive' && git push)
